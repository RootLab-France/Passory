name: Tests et build Windows

# Les tests tournent a chaque poussee et a chaque pull request.
# L'executable n'est construit que sur une etiquette de version (v1.0.0) ou a la demande.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installation des dependances
        run: npm ci

      - name: Suite de tests
        run: npm test

  build-windows:
    name: Build Windows
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installation des dependances
        run: npm ci

      - name: Construction de l'executable
        run: npm run dist:win

      - name: Publication de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: passory-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30

      # Sur une etiquette de version uniquement : publie une release GitHub
      # avec l'installateur attache, en brouillon pour que tu relises avant
      # de la rendre visible.
      - name: Publication de la release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Passory $version" \
            --notes "Installateur Windows de Passory $version.

          Passory est un gestionnaire de mots de passe local et chiffre, sans compte ni serveur.
          Code source sous licence GPL-3.0 : https://github.com/RootLab-France/Passory
          Site : https://passory.rootlab.fr

          L'executable n'est pas encore signe : Windows SmartScreen peut afficher un
          avertissement au premier lancement." \
            dist/*.exe
