name: Tests et build Windows

# Les tests tournent a chaque poussee et a chaque pull request.
# L'executable n'est construit que sur une etiquette de version (v1.0.0) ou a la demande.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installation des dependances
        run: npm ci

      - name: Suite de tests
        run: npm test

  build-windows:
    name: Build Windows
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installation des dependances
        run: npm ci

      - name: Construction de l'executable
        run: npm run dist:win

      - name: Publication de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: passory-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30
