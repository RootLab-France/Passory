<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'; worker-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Passory</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <link rel="stylesheet" href="assets/css/mobile.css" />
  <script src="src/platform/web-bootstrap.js" defer></script>
</head>
<body class="bg-gray-900 text-white h-screen flex items-center justify-center">
  <!--
    Point d'entrée mobile : bootstrap Capacitor, puis redirection vers
    login.html ou create-master-password.html selon l'existence d'un master.
    Sur Electron, cette page n'est pas utilisée : main.js charge directement
    la bonne page via BrowserWindow.loadFile().
  -->
  <div id="splash" class="flex flex-col items-center space-y-4 px-6 text-center">
    <img src="logo.png" alt="Passory" class="h-16 w-16" />
    <div id="splash-msg" class="text-gray-400 text-sm">Chargement…</div>
    <pre id="splash-err" class="hidden text-red-400 text-xs text-left whitespace-pre-wrap max-w-xs"></pre>
  </div>

  <script src="assets/js/page-index.js"></script>
</body>
</html>
