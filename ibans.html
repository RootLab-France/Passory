<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'; worker-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Passory — Comptes bancaires</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <link rel="stylesheet" href="assets/css/passory-ui.css" />
  <link rel="stylesheet" href="assets/css/mobile.css" />
  <script src="src/platform/web-bootstrap.js" defer></script>
  <link rel="stylesheet" href="assets/fa/css/all.min.css" />
  <style>
    .drag { -webkit-app-region: drag; }
    .no-drag { -webkit-app-region: no-drag; }
  </style>
</head>
<body class="flex flex-col h-screen select-none">

  <div class="titlebar drag">
    <div class="titlebar-left">
      <img src="logo.png" alt="logo" class="h-5 w-5" />
      <span class="titlebar-title">Comptes / IBAN</span>
    </div>
    <div class="no-drag titlebar-controls">
      <button id="btn-minimize" class="titlebar-btn"><i class="fas fa-minus"></i></button>
      <button id="btn-maximize" class="titlebar-btn"><i class="far fa-square"></i></button>
      <button id="btn-close"    class="titlebar-btn close"><i class="fas fa-times"></i></button>
    </div>
  </div>

  <div class="flex flex-1 overflow-hidden">
    <aside data-sidebar data-active="ibans"></aside>

    <main class="page-main">
      <div class="page-content">

        <div class="page-header">
          <div>
            <h1 class="page-title">Comptes / IBAN</h1>
            <p class="page-subtitle" id="count-label">…</p>
          </div>
          <button id="add-btn" class="btn btn-primary">
            <i class="fas fa-plus" aria-hidden="true"></i>Ajouter
          </button>
        </div>

        <div class="search-wrap mb-5" style="max-width:380px">
          <i class="fas fa-magnifying-glass search-icon" aria-hidden="true"></i>
          <input id="search" type="search" aria-label="Rechercher" placeholder="Rechercher (nom, banque, titulaire)…"
                 class="form-input" style="padding-left:32px" />
        </div>

        <div id="list" class="flex flex-col gap-2"></div>

        <div id="empty" class="empty-state hidden">
          <div class="empty-state-icon"><i class="fas fa-building-columns"></i></div>
          <div class="empty-state-title">Aucun compte enregistré</div>
          <div class="empty-state-sub">Ajoutez un IBAN ou un compte bancaire.</div>
        </div>

      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-dialog" style="max-width:500px">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">Ajouter un compte</h2>
        <button id="modal-close" class="modal-close" type="button" aria-label="Fermer" title="Fermer (Échap)"><i class="fas fa-times" aria-hidden="true"></i></button>
      </div>
      <div class="modal-body">
        <form id="modal-form" novalidate>
          <input type="hidden" id="m-id" />
          <div class="grid grid-cols-2 gap-3">

            <div class="form-group col-span-2">
              <label class="form-label" for="m-label">Nom <span aria-hidden="true">*</span><span class="sr-only">(obligatoire)</span></label>
              <input id="m-label" type="text" required placeholder="Ex. Compte courant"
                     class="form-input" />
            </div>

            <div class="form-group col-span-2">
              <label class="form-label" for="m-bank">Banque</label>
              <input id="m-bank" type="text" class="form-input" />
            </div>

            <div class="form-group col-span-2">
              <label class="form-label" for="m-holder">Titulaire</label>
              <input id="m-holder" type="text" placeholder="Prénom NOM" class="form-input" />
            </div>

            <div class="form-group col-span-2">
              <label class="form-label" for="m-iban">IBAN</label>
              <input id="m-iban" type="text" autocomplete="off" placeholder="FR76 3000 …"
                     class="form-input mono" />
              <p id="iban-feedback" class="text-xs mt-1" style="color:var(--text-secondary)"></p>
            </div>

            <div class="form-group col-span-2">
              <label class="form-label" for="m-bic">BIC / SWIFT</label>
              <input id="m-bic" type="text" autocomplete="off" placeholder="BNPAFRPPXXX" maxlength="11"
                     class="form-input mono uppercase" />
            </div>

            <div class="form-group col-span-2">
              <label class="form-label" for="m-notes">Notes</label>
              <textarea id="m-notes" rows="2" class="form-input form-textarea"></textarea>
            </div>

          </div>
        </form>
      </div>
      <div class="modal-footer">
        <div id="modal-loader" class="hidden modal-loader flex-1 text-left">
          <i class="fas fa-spinner spin mr-2" aria-hidden="true"></i>Enregistrement…
        </div>
        <button type="button" id="modal-cancel" class="btn btn-ghost">Annuler</button>
        <button type="submit" form="modal-form" id="modal-save" class="btn btn-success">
          <i class="fas fa-check"></i>Enregistrer
        </button>
      </div>
    </div>
  </div>

  <script src="src/shared/features.js"></script>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/ibans.js"></script>
</body>
</html>
